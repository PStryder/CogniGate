[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short --cov=cognigate --cov-report=term-missing --cov-report=html
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security-related tests
    slow: Slow running tests
