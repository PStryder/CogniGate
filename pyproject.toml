[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognigate"
version = "0.2.0"
description = "A general-purpose cognitive execution worker"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "circuitbreaker>=1.4.0",
    "redis>=5.0.0",
    # Canonical receipt protocol. Hard dependency: this gate must not be able
    # to start without the validator, and must never fall back to posting
    # unvalidated dictionaries to the ledger.
    "legivellum",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
cognigate = "cognigate.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# legivellum is the sibling protocol package, not published to an index.
[tool.uv.sources]
legivellum = { path = "../LegiVellum", editable = true }
