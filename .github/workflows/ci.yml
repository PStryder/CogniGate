name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout LegiVellum (canonical protocol package)
        uses: actions/checkout@v4
        with:
          repository: PStryder/LegiVellum
          path: _legivellum
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Canonical protocol package first. It is a hard dependency and is
          # not published to an index, so it comes from the sibling checkout.
          python -m pip install -e ./_legivellum
          python -m pip install -e ".[dev]"
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Dependency health
        run: python -m pip check

      - name: Compile check
        run: python -m compileall -q src/cognigate

      - name: Ruff (full repo)
        run: ruff check src/cognigate --select E9,F63,F7,F82

      - name: Mypy (full repo)
        run: python -m mypy --config-file .mypy-ci.ini src/cognigate

      - name: Run tests with coverage gate
        run: pytest -q --maxfail=1 -m "not slow" --cov-fail-under=50

      - name: Docker build
        # Stack-root context. The image installs the canonical protocol
        # package from the sibling LegiVellum checkout: `legivellum` is a hard
        # dependency and is not published to an index, so a repo-scoped context
        # fails with "No matching distribution found for legivellum".
        run: |
          mkdir -p _ctx/CogniGate
          cp -r _legivellum _ctx/LegiVellum
          cp -r requirements.txt src _ctx/CogniGate/
          docker build -f Dockerfile -t cognigate-ci _ctx
